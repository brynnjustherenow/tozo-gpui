[package]
name = "tozo-platform"
description = "Windows platform layer for tozo-gpui (appbar, window effects, hooks)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Networking",
    "Networking_Connectivity",
    "Media_Control",
    "Storage_Streams",
] }
windows-future = "0.3"
windows-core = "0.62"
tracing = "0.1"
tokio = "1"
sysinfo = "0.39"
