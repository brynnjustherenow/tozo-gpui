[package]
name = "tozo-gpui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
gpui-kit = "0.7.3"
tozo-platform = { path = "crates/tozo-platform" }
tozo-extra = { path = "crates/tozo-extra" }
chrono = "0.4"
futures = "0.3"
smallvec = "1"
sysinfo = "0.39"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows-future = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Networking",
    "Networking_Connectivity",
] }
systray-util = "0.2.0"
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
tracing-appender = "0.2"

[features]

gui = []

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# panic 直接 abort：去掉 landing pad 与 unwind 表；若需要 unwind 隔离可删此行
panic = "abort"
